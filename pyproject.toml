[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jankhunter"
version = "0.1.0"
description = "Black-box visual-bug detector and auto-fixer for canvas/WebGL web UIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "JankHunter Contributors" }]
keywords = ["visual-testing", "canvas", "webgl", "jank", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "typer[all]>=0.12",
    "playwright>=1.44",
    "numpy>=1.26",
    "scipy>=1.13",
    "opencv-python>=4.9",
    "matplotlib>=3.9",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
jankhunter = "jankhunter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["jankhunter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
